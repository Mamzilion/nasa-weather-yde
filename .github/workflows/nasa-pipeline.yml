name: NASA Weather Data Pipeline

on:
  schedule:
    - cron: '0 */4 * * *' # Exécution toutes les 4 heures
  workflow_dispatch: # Permet un déclenchement manuel depuis l'interface GitHub

jobs:
  update-weather-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Nécessaire pour autoriser le bot à commiter les changements

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Création du dossier public si absent
        run: mkdir -p public

      - name: Exécution du script de récupération NASA
        run: python update_data.py

      - name: Commit et Push automatique des nouvelles données
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/weather_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: mise a jour automatique donnees NASA Yaounde [skip ci]" && git push)